<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your River Cruise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --water-deep:#16262a;
    --water:#54868e;
    --water-light:#a9c9cd;
    --foam:#f4f8f7;
    --sand:#d8c9a3;
    --ink:#16262a;
    --ink-soft:#4d5f61;
    --radius:14px;
    --shadow:0 20px 45px -25px rgba(22,38,42,.35);
  }
  *{box-sizing:border-box;}
  .rcq-root{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    max-width:640px;
    margin:0 auto;
    background:var(--foam);
    border-radius:24px;
    padding:36px 32px 32px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .rcq-quiz-body{
    display:flex;
    flex-direction:column;
    min-height:520px;
  }
  .rcq-root::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:180px; height:180px;
    border-radius:50%;
    background:radial-gradient(circle, var(--water-light) 0%, transparent 70%);
    opacity:.5;
    pointer-events:none;
  }
  .rcq-eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--water);
    font-weight:600;
    margin:0 0 6px;
  }
  .rcq-track{
    display:flex;
    gap:6px;
    margin-bottom:28px;
  }
  .rcq-seg{
    flex:1;
    height:4px;
    border-radius:2px;
    background:rgba(84,134,142,.18);
    overflow:hidden;
  }
  .rcq-seg i{
    display:block;
    height:100%;
    width:0%;
    background:var(--water);
    transition:width .45s cubic-bezier(.65,0,.35,1);
    border-radius:2px;
  }
  .rcq-seg.done i{ width:100%; }
  .rcq-seg.active i{ width:100%; }

  .rcq-question{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(21px, 4vw, 26px);
    line-height:1.3;
    margin:0 0 22px;
    letter-spacing:-.01em;
  }
  .rcq-options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:22px;
  }
  .rcq-option{
    text-align:left;
    background:#fff;
    border:1.5px solid rgba(22,38,42,.1);
    border-radius:12px;
    padding:15px 18px;
    font-family:'Inter', sans-serif;
    font-size:15.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
    line-height:1.45;
  }
  .rcq-option:hover{
    border-color:var(--water);
    background:#fbfdfd;
  }
  .rcq-option:active{ transform:scale(.995); }
  .rcq-option:focus-visible{
    outline:2px solid var(--water);
    outline-offset:2px;
  }
  .rcq-option.selected{
    border-color:var(--water);
    background:linear-gradient(0deg, rgba(84,134,142,.08), rgba(84,134,142,.08)), #fff;
    box-shadow:inset 0 0 0 1px var(--water);
  }

  .rcq-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:auto;
    padding-top:12px;
  }
  .rcq-back{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:14px;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 4px;
    visibility:hidden;
  }
  .rcq-back.show{ visibility:visible; }
  .rcq-back:hover{ color:var(--ink); }
  .rcq-counter{
    font-size:13px;
    color:var(--ink-soft);
  }

  /* Results */
  .rcq-results{
    display:none;
    min-height:520px;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .rcq-results.show{ display:flex; }
  .rcq-quiz-body.hide{ display:none; }

  .rcq-result-eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--water);
    font-weight:600;
    margin:0 0 8px;
  }
  .rcq-result-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(30px, 6vw, 40px);
    line-height:1.08;
    margin:0 0 14px;
    color:var(--water-deep);
  }
  .rcq-result-blurb{
    font-size:15.5px;
    line-height:1.65;
    color:var(--ink-soft);
    margin:0 auto 20px;
    max-width:46ch;
  }
  .rcq-also{
    font-size:14px;
    color:var(--ink-soft);
    background:#fff;
    border:1px solid rgba(22,38,42,.08);
    border-radius:10px;
    padding:12px 16px;
    margin:0 auto 26px;
    max-width:fit-content;
  }
  .rcq-also strong{ color:var(--ink); }

  .rcq-cta-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-bottom:18px;
  }
  .rcq-cta{
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:600;
    padding:13px 24px;
    border-radius:999px;
    text-decoration:none;
    cursor:pointer;
    border:1.5px solid transparent;
    transition:opacity .15s ease, transform .12s ease;
  }
  .rcq-cta:active{ transform:scale(.98); }
  .rcq-cta.primary{
    background:var(--water-deep);
    color:#fff;
  }
  .rcq-cta.primary:hover{ opacity:.88; }
  .rcq-cta.secondary{
    background:transparent;
    border-color:var(--water-deep);
    color:var(--water-deep);
  }
  .rcq-cta.secondary:hover{ background:rgba(22,38,42,.06); }

  .rcq-restart{
    background:none;
    border:none;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    padding:4px 0;
  }
  .rcq-restart:hover{ color:var(--ink); }

  @media (max-width:480px){
    .rcq-root{ padding:26px 20px 24px; border-radius:18px; }
    .rcq-cta-row{ flex-direction:column; }
    .rcq-cta{ text-align:center; width:100%; }
  }
</style>
</head>
<body>

<div class="rcq-root" id="rcqRoot">

  <!-- QUIZ -->
  <div class="rcq-quiz-body" id="rcqQuizBody">
    <p class="rcq-eyebrow">Find your river</p>
    <div class="rcq-track" id="rcqTrack"></div>

    <h2 class="rcq-question" id="rcqQuestionText"></h2>
    <div class="rcq-options" id="rcqOptions"></div>

    <div class="rcq-nav">
      <button class="rcq-back" id="rcqBack" type="button">&larr; Back</button>
      <span class="rcq-counter" id="rcqCounter"></span>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="rcq-results" id="rcqResults">
    <p class="rcq-result-eyebrow">Your river match</p>
    <h2 class="rcq-result-name" id="rcqResultName"></h2>
    <p class="rcq-result-blurb" id="rcqResultBlurb"></p>
    <p class="rcq-also" id="rcqAlso"></p>

    <div class="rcq-cta-row">
      <a class="rcq-cta primary" id="rcqCtaExplore" href="#" target="_blank" rel="noopener">Explore Destination</a>
      <a class="rcq-cta secondary" id="rcqCtaBlog" href="#" target="_blank" rel="noopener">Read Blogs</a>
    </div>
    <button class="rcq-restart" id="rcqRestart" type="button">Take the Quiz Again</button>
  </div>

</div>

<script>
(function(){

  // ---- River content (Main is treated as part of the Danube family, per brand relationship) ----
  var RIVER_INFO = {
    Danube: {
      name: "The Danube",
      blurb: "Vienna's palaces, Budapest's lit-up bridges, Passau's baroque spires \u2014 the Danube (including its Main tributary) is Europe's classic river cruise, built for travelers who want the icons without the rush.",
      exploreUrl: "#explore-danube",
      blogUrl: "#blog-danube"
    },
    Rhine: {
      name: "The Rhine",
      blurb: "Castle-topped cliffs, terraced vineyards and villages built around church bells \u2014 the Rhine is the fairytale everyone pictures when they imagine a river cruise.",
      exploreUrl: "#explore-rhine",
      blogUrl: "#blog-rhine"
    },
    "Rh\u00f4ne": {
      name: "The Rh\u00f4ne",
      blurb: "Vineyards, market towns and Lyon's bouchons \u2014 the Rh\u00f4ne moves at the pace of a long lunch, for travelers who taste and linger their way through a place.",
      exploreUrl: "#explore-rhone",
      blogUrl: "#blog-rhone"
    },
    Douro: {
      name: "The Douro",
      blurb: "Portugal's Douro carves through terraced vineyards most travelers have never seen \u2014 quiet, golden, and made for slowing all the way down.",
      exploreUrl: "#explore-douro",
      blogUrl: "#blog-douro"
    },
    Moselle: {
      name: "The Moselle",
      blurb: "Steep slate vineyards, half-timbered villages, hardly another cruise in sight \u2014 the Moselle is Europe's best-kept river secret.",
      exploreUrl: "#explore-moselle",
      blogUrl: "#blog-moselle"
    }
  };

  // Tie-break / display priority order
  var RIVER_ORDER = ["Danube", "Rhine", "Rh\u00f4ne", "Douro", "Moselle"];

  // Normalizes a raw river name so "Main" always scores as "Danube"
  function norm(r){ return r === "Main" ? "Danube" : r; }

  // ---- Questions ----
  var QUESTIONS = [
    {
      text: "Is this your first river cruise?",
      scored: true,
      options: [
        { label: "Yes", rivers: ["Danube","Main","Rhine","Rh\u00f4ne","Douro","Moselle"] },
        { label: "No", rivers: ["Danube","Main","Rhine","Rh\u00f4ne","Douro","Moselle"] }
      ]
    },
    {
      text: "What matters most to you in a destination?",
      scored: true,
      options: [
        { label: "Iconic history and grand, well-loved sights", rivers: ["Danube","Main"] },
        { label: "Fairytale castles and charming towns", rivers: ["Rhine","Moselle"] },
        { label: "Art, food and local culture", rivers: ["Rh\u00f4ne","Douro"] },
        { label: "Discovering somewhere less explored", rivers: ["Moselle","Douro"] }
      ]
    },
    {
      text: "How do you like to spend your days?",
      scored: true,
      options: [
        { label: "Exploring grand cities and historic sights", rivers: ["Danube","Rh\u00f4ne"] },
        { label: "Strolling through charming towns and villages", rivers: ["Rhine","Moselle"] },
        { label: "Relaxing on deck, taking in the scenery as it drifts by", rivers: ["Rhine","Douro"] },
        { label: "Getting off the boat to hike hills or explore riverside trails", rivers: ["Douro","Moselle"] }
      ]
    },
    {
      text: "What's your ideal pace?",
      scored: true,
      options: [
        { label: "Relaxed and unhurried", rivers: ["Rhine","Douro"] },
        { label: "A mix of sightseeing and downtime", rivers: ["Danube","Rh\u00f4ne"] },
        { label: "Slow, intimate and a little unexpected", rivers: ["Moselle","Douro"] },
        { label: "I want to make the most of every destination", rivers: ["Danube","Rh\u00f4ne","Main"] }
      ]
    },
    {
      text: "What kind of scenery excites you most?",
      scored: true,
      options: [
        { label: "Vineyard-covered hillsides", rivers: ["Rhine","Douro","Moselle"] },
        { label: "Warm landscapes and riverside villages", rivers: ["Rh\u00f4ne","Douro"] },
        { label: "Grand historic cityscapes", rivers: ["Danube","Main"] },
        { label: "A mix of countryside and classic European towns", rivers: ["Rhine","Danube","Main"] }
      ]
    },
    {
      text: "When are you planning to travel?",
      scored: false,
      options: [
        { label: "February \u2013 March", rivers: [] },
        { label: "April \u2013 May", rivers: [] },
        { label: "June \u2013 August", rivers: [] },
        { label: "November \u2013 December", rivers: [] }
      ]
    },
    {
      text: "What's your travel personality?",
      scored: true,
      options: [
        { label: "Classic and culturally curious", rivers: ["Danube","Main"] },
        { label: "Romantic and scenic", rivers: ["Rhine","Douro"] },
        { label: "Artsy and adventurous", rivers: ["Rh\u00f4ne","Douro"] },
        { label: "An in-the-know explorer", rivers: ["Moselle","Douro"] }
      ]
    },
    {
      text: "What's your top priority when choosing a cruise?",
      scored: true,
      options: [
        { label: "Popularity \u2014 I want a tried-and-true favourite", rivers: ["Danube","Main"] },
        { label: "Uniqueness \u2014 I want something off the beaten path", rivers: ["Moselle","Douro"] },
        { label: "Beautiful scenery \u2014 I want the journey itself to be part of the experience", rivers: ["Rhine","Douro"] },
        { label: "Food, wine and culture \u2014 I want a rich sensory experience", rivers: ["Rh\u00f4ne","Douro"] }
      ]
    }
  ];

  // ---- State ----
  var current = 0;
  var answers = new Array(QUESTIONS.length).fill(null); // stores selected option index per question

  // ---- DOM refs ----
  var quizBody = document.getElementById('rcqQuizBody');
  var resultsEl = document.getElementById('rcqResults');
  var trackEl = document.getElementById('rcqTrack');
  var qTextEl = document.getElementById('rcqQuestionText');
  var optionsEl = document.getElementById('rcqOptions');
  var backBtn = document.getElementById('rcqBack');
  var counterEl = document.getElementById('rcqCounter');

  function buildTrack(){
    trackEl.innerHTML = '';
    QUESTIONS.forEach(function(){
      var seg = document.createElement('div');
      seg.className = 'rcq-seg';
      var fill = document.createElement('i');
      seg.appendChild(fill);
      trackEl.appendChild(seg);
    });
  }

  function updateTrack(){
    var segs = trackEl.children;
    for (var i = 0; i < segs.length; i++){
      segs[i].classList.remove('done','active');
      if (i < current) segs[i].classList.add('done');
      else if (i === current) segs[i].classList.add('active');
    }
  }

  function renderQuestion(){
    var q = QUESTIONS[current];
    qTextEl.textContent = q.text;
    counterEl.textContent = 'Question ' + (current + 1) + ' of ' + QUESTIONS.length;
    backBtn.classList.toggle('show', current > 0);

    optionsEl.innerHTML = '';
    q.options.forEach(function(opt, idx){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rcq-option';
      if (answers[current] === idx) btn.classList.add('selected');
      btn.textContent = opt.label;
      btn.addEventListener('click', function(){ selectOption(idx); });
      optionsEl.appendChild(btn);
    });

    updateTrack();
  }

  function selectOption(idx){
    answers[current] = idx;
    if (current < QUESTIONS.length - 1){
      current += 1;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function goBack(){
    if (current === 0) return;
    current -= 1;
    renderQuestion();
  }

  function computeScores(){
    var scores = { Danube: 0, Rhine: 0, "Rh\u00f4ne": 0, Douro: 0, Moselle: 0 };
    QUESTIONS.forEach(function(q, qi){
      if (!q.scored) return;
      var chosen = answers[qi];
      if (chosen === null) return;
      q.options[chosen].rivers.forEach(function(r){
        scores[norm(r)] += 1;
      });
    });
    return scores;
  }

  function rankRivers(scores){
    return RIVER_ORDER.slice().sort(function(a, b){
      return scores[b] - scores[a];
    });
  }

  function showResults(){
    var scores = computeScores();
    var ranked = rankRivers(scores);
    var top = ranked[0];
    var second = ranked[1];

    var info = RIVER_INFO[top];
    document.getElementById('rcqResultName').textContent = info.name;
    document.getElementById('rcqResultBlurb').textContent = info.blurb;
    document.getElementById('rcqAlso').innerHTML =
      'You might also love <strong>' + RIVER_INFO[second].name + '</strong>.';

    var exploreBtn = document.getElementById('rcqCtaExplore');
    var blogBtn = document.getElementById('rcqCtaBlog');
    exploreBtn.href = info.exploreUrl;
    blogBtn.href = info.blogUrl;

    quizBody.classList.add('hide');
    resultsEl.classList.add('show');
  }

  function restart(){
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    resultsEl.classList.remove('show');
    quizBody.classList.remove('hide');
    renderQuestion();
  }

  backBtn.addEventListener('click', goBack);
  document.getElementById('rcqRestart').addEventListener('click', restart);

  buildTrack();
  renderQuestion();

})();
</script>

</body>
</html>
